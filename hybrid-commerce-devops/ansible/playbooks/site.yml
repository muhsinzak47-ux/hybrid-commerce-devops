---
# Hybrid Commerce Ansible Playbook
# Purpose: Configure Ubuntu 24.04 server for the application

- name: Configure Hybrid Commerce Application Server
  hosts: all
  become: true
  vars:
    app_name: "hybrid-commerce"
    app_user: "appuser"
    app_port: 8000
    db_port: 5432

  pre_tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

  roles:
    - role: users
    - role: packages
    - role: docker
    - role: firewall
    - role: ssh_hardening
    - role: app_deploy

  tasks:
    - name: Ensure application directory exists
      file:
        path: "/opt/{{ app_name }}"
        state: directory
        owner: "{{ app_user }}"
        mode: '0755'

    - name: Copy application files
      synchronize:
        src: "../app/backend/"
        dest: "/opt/{{ app_name }}/"
        recursive: yes
      ignore_errors: yes  # Use git clone in production

    - name: Create Python virtual environment
      command: python3 -m venv /opt/{{ app_name }}/venv
      args:
        creates: /opt/{{ app_name }}/venv/bin/python
      become_user: "{{ app_user }}"

    - name: Install Python dependencies
      pip:
        requirements: "/opt/{{ app_name }}/requirements.txt"
        virtualenv: "/opt/{{ app_name }}/venv"
      become_user: "{{ app_user }}"

    - name: Create systemd service
      copy:
        dest: "/etc/systemd/system/{{ app_name }}.service"
        content: |
          [Unit]
          Description=Hybrid Commerce Backend API
          After=network.target

          [Service]
          Type=simple
          User={{ app_user }}
          WorkingDirectory=/opt/{{ app_name }}
          Environment="PATH=/opt/{{ app_name }}/venv/bin"
          ExecStart=/opt/{{ app_name }}/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ app_port }}
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Enable and start service
      systemd:
        name: "{{ app_name }}"
        enabled: yes
        state: started

    - name: Verify application is running
      uri:
        url: "http://localhost:{{ app_port }}/health"
        method: GET
        status_code: 200
      register: health_check
      retries: 10
      delay: 5
      until: health_check.status == 200
      ignore_errors: yes
