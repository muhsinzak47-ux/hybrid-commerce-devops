# Common server setup
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - curl
      - ufw
    state: present

- name: Create application user
  user:
    name: "{{ app_user }}"
    create_home: true
    shell: /bin/bash
    state: present
